name: Web application

on:
  push:
    branches-ignore:
      - main
      - develop
      - 'release/**'
    paths:
      - 'src/**'
      - 'Directory.*.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'VERSION'
      - '.dockerignore'
      - '.github/workflows/web.yml'
      - 'deploy/web/**'
  pull_request:
    paths:
      - 'src/**'
      - 'Directory.*.props'
      - 'Directory.Build.targets'
      - 'global.json'
      - 'VERSION'
      - '.dockerignore'
      - '.github/workflows/web.yml'
      - 'deploy/web/**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build and smoke-test web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      deployment-image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ValIO.Web/Dockerfile
          load: true
          tags: valio-web:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=valio-web
          cache-to: type=gha,mode=max,scope=valio-web

      - name: Verify image health and public endpoints
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name valio-web-smoke \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --volume /home/app/.aspnet/DataProtection-Keys \
            --publish 127.0.0.1:18080:8080 valio-web:ci
          trap 'docker logs valio-web-smoke; docker rm --force --volumes valio-web-smoke' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-connrefused http://127.0.0.1:18080/healthz
          python3 deploy/web/smoke.py http://127.0.0.1:18080

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/valio-web"
          docker tag valio-web:ci "${image}:${COMMIT}"
          docker tag valio-web:ci "${image}:latest"
          docker push "${image}:${COMMIT}"
          docker push "${image}:latest"
          digest="$(docker image inspect "${image}:${COMMIT}" --format '{{index .RepoDigests 0}}')"
          echo "image=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published web image: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy web application
    needs: image
    if: >-
      vars.VALIO_WEB_DEPLOY_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, valio-deploy]
    timeout-minutes: 15
    environment:
      name: web-production
      url: ${{ vars.VALIO_WEB_URL }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: valio-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy immutable image and await health
        shell: bash
        env:
          VALIO_WEB_IMAGE: ${{ needs.image.outputs.deployment-image }}
          VALIO_WEB_DEPLOY_PATH: ${{ vars.VALIO_WEB_DEPLOY_PATH }}
        run: bash deploy/web/deploy.sh
